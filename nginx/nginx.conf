# ==============================================================================
# CONXIAN PROTOCOL SURFACE (conxian.org) NGINX FIREWALL CONFIGURATION
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # --------------------------------------------------------------------------
    # SECURITY HEADERS & DOMAIN FIREWALL ENFORCEMENT
    # --------------------------------------------------------------------------
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://*.conxian.org;" always;

    # --------------------------------------------------------------------------
    # MAIN PROTOCOL SURFACE: conxian.org
    # --------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name conxian.org www.conxian.org;

        root /usr/share/nginx/html;
        index index.html;

        # Strict CORS Header - Allowed for Protocol Subdomains only
        location / {
            if ($http_origin ~* (https?://.*\.conxian\.org$)) {
                add_header 'Access-Control-Allow-Origin' "$http_origin" always;
                add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
            }

            # Reject requests from conxian-labs.com corporate origins attempting state leaks
            if ($http_origin ~* (https?://.*\.conxian-labs\.com$)) {
                return 403;
            }

            # Unmatched paths must return a real 404 status. Serving /404.html
            # as a fallback file (the previous form) returned HTTP 200 for
            # every unknown path, which masked the true discovery state of the
            # public surface (RFC 9110 status-code correctness).
            try_files $uri $uri/ $uri/index.html =404;
        }

        # Serve the Astro 404 page with a genuine 404 status.
        error_page 404 /404.html;
        location = /404.html {
            internal;
        }

        # Cache static assets
        location ~* \.(?:css|js|webp|png|jpg|jpeg|gif|ico|svg|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
